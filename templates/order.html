{% extends "base.html" %}

{% block title %}Place Order{% endblock %}

{% block content %}
<h2>Order Form</h2>

{% if product %}
<div class="card">
    <p><strong>Product:</strong> {{ product.name }}</p>
    <p><strong>Price:</strong> &#8377;{{ "%.2f"|format(product.price) }}</p>
</div>

{% if message %}
<div class="message error">{{ message }}</div>
{% endif %}

<form method="POST" action="{{ url_for('order', id=product.id) }}">
    <label for="customer_name">Customer Name:</label>
    <input type="text" id="customer_name" name="customer_name" required>

    <label for="product_name">Product Name:</label>
    <input type="text" id="product_name" value="{{ product.name }}" readonly>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" min="1" step="1" required>

    <button type="submit">Place Order</button>
</form>
{% else %}
<div class="message error">{{ message }}</div>
{% endif %}
{% endblock %}
